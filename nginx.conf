server {
    listen 80;
    server_name localhost;
    
    # Корневая директория (совместимость с Vite)
    root /usr/share/nginx/html;
    
    # Отключаем вывод версии nginx в заголовках
    server_tokens off;
    
    # Настройки для SPA
    location / {
        try_files $uri $uri/ /index.html;
        
        # Оптимизация кэширования статики
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }
    
    # Проксирование API-запросов
    location /api/ {
        proxy_pass http://app:8000/;  # Имя сервиса из docker-compose.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Блок для Vite HMR в development-режиме
    location /@vite/ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Обслуживание статических assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Блокировка служебных файлов
    location ~* \.(env|git|sh|docker|md)$ {
        deny all;
        return 404;
    }
    
    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1000;
    
    # Обработка ошибок
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}